name: ita-jobs-daily

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motif optionnel du test manuel du workflow daily"
        required: false
        default: ""
  schedule:
    # GitHub cron is UTC. 23:00 UTC is 00:00 Paris in winter (CET)
    # and 01:00 Paris in summer (CEST), so a single cron stays within
    # the requested midnight-to-01:00 Europe/Paris execution window.
    - cron: "0 23 * * *"

concurrency:
  group: ita-jobs-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether to collect
        id: schedule
        run: |
          paris_time=$(TZ=Europe/Paris date '+%Y-%m-%dT%H:%M:%S%z')
          paris_hour=$(TZ=Europe/Paris date '+%H')
          paris_minute=$(TZ=Europe/Paris date '+%M')
          echo "paris_time=$paris_time" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_collect=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
          elif { [ "$paris_hour" = "00" ] || [ "$paris_hour" = "01" ]; } && [ "$paris_minute" = "00" ]; then
            echo "should_collect=true" >> "$GITHUB_OUTPUT"
            echo "reason=paris_window" >> "$GITHUB_OUTPUT"
          else
            echo "should_collect=false" >> "$GITHUB_OUTPUT"
            echo "reason=outside_paris_window" >> "$GITHUB_OUTPUT"
          fi

      - name: Record workflow launch
        if: always()
        continue-on-error: true
        run: |
          python -m app.workflow_event_log \
            --event-type daily_workflow \
            --status started \
            --details-json '{"should_collect":"${{ steps.schedule.outputs.should_collect }}","reason":"${{ steps.schedule.outputs.reason }}","paris_time":"${{ steps.schedule.outputs.paris_time }}"}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Install dependencies
        id: install
        if: steps.schedule.outputs.should_collect == 'true'
        run: pip install -r requirements.txt

      - name: Run collector
        id: collect
        if: steps.schedule.outputs.should_collect == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOBS_ARCHIVE_MISSED_THRESHOLD: "2"
          USER_AGENT: "ITA Jobs Bot/1.0 (+GitHub Actions)"
          MANUAL_REASON: ${{ github.event.inputs.reason }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch on daily workflow: bypass Paris guard"
            if [ -n "$MANUAL_REASON" ]; then
              echo "Manual test reason: $MANUAL_REASON"
            fi
            python -m app.main_collect_daily --skip-paris-guard
          else
            python -m app.main_collect_daily
          fi

      - name: Record workflow completion
        if: always()
        continue-on-error: true
        run: |
          python -m app.workflow_event_log \
            --event-type daily_workflow \
            --status '${{ job.status }}' \
            --details-json '{"should_collect":"${{ steps.schedule.outputs.should_collect }}","reason":"${{ steps.schedule.outputs.reason }}","paris_time":"${{ steps.schedule.outputs.paris_time }}","install_conclusion":"${{ steps.install.conclusion }}","collector_conclusion":"${{ steps.collect.conclusion }}"}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIPELINE_RUN_ID: ${{ steps.collect.outputs.pipeline_run_id }}

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ita-jobs-runs
          path: agent/data/runs
          if-no-files-found: warn

      - name: Send run summary email
        if: always() && steps.schedule.outputs.should_collect == 'true' && steps.collect.outputs.did_run == 'true'
        continue-on-error: true
        working-directory: agent
        run: python -m app.run_summary_email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUMMARY_EMAIL_ENABLED: ${{ vars.SUMMARY_EMAIL_ENABLED }}
          SUMMARY_EMAIL_TO: ${{ vars.SUMMARY_EMAIL_TO || 'rejoignez-nous@acta.asso.fr' }}
          SUMMARY_EMAIL_FROM: ${{ vars.SUMMARY_EMAIL_FROM }}
          SUMMARY_EMAIL_SUBJECT_PREFIX: ${{ vars.SUMMARY_EMAIL_SUBJECT_PREFIX }}
          APP_MONITORING_URL: ${{ vars.APP_MONITORING_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          PIPELINE_RUN_ID: ${{ steps.collect.outputs.pipeline_run_id }}
